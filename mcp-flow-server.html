<script type="text/javascript">
    RED.nodes.registerType('mcp-endpoint', {
        category: 'config',
        defaults: {
            name: { value: '' },
            serverName: { value: 'node-red-mcp-server', required: true },
            serverPath: { value: '/mcp', required: true },
            advertisedScopes: { value: '' },
            adminToolsEnabled: { value: false },
            adminPort: { value: 1880, required: true, validate: RED.validators.number() }
        },
        credentials: {
            adminToken: { type: 'password' }
        },
        label: function() {
            return this.name || this.serverName || 'MCP Endpoint';
        }
    });

    RED.nodes.registerType('mcp-flow-server', {
        category: 'mcp',
        color: '#9C27B0',
        defaults: {
            name: { value: '' },
            endpoint: { value: '', type: 'mcp-endpoint', required: false },
            serverName: { value: 'node-red-mcp-server', required: false },
            serverPath: { value: '/mcp', required: false },
            serverPort: { value: 8001, required: true, validate: function(v) { return v > 0 && v < 65536; } },
            autoStart: { value: false },
            enableCors: { value: true },
            advertisedScopes: { value: '' },
            enablePicker: { value: true },
            adminToolsEnabled: { value: false },
            adminPort: { value: 1880 }
        },
        credentials: {
            adminToken: { type: 'password' }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-cogs',
        label: function() {
            return this.name || 'MCP Flow Server';
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function() {
            function loadFlowServers() {
                $.ajax({ url: 'mcp-flow-servers', method: 'GET', timeout: 5000 })
                    .done(function(data) {
                        var statusDiv = $('#flow-servers-status');
                        if (data.servers && data.servers.length > 0) {
                            var html = '<h5>Running Flow Servers:</h5><ul>';
                            data.servers.forEach(function(server) {
                                var status = server.isRunning ? 'running' : 'stopped';
                                html += '<li>' + status + ' ' + server.serverName + ' ' + (server.path || '/mcp') + ' (port ' + server.port + ') - ' + server.toolCount + ' tools</li>';
                            });
                            statusDiv.html(html + '</ul>');
                        } else {
                            statusDiv.html('<p>No flow servers currently running</p>');
                        }
                    })
                    .fail(function() {
                        $('#flow-servers-status').html('<p>Failed to load flow server status</p>');
                    });
            }

            $('#test-port-btn').click(function() {
                var button = $(this);
                var originalText = button.text();
                var port = $('#node-input-serverPort').val();
                if (!port) {
                    RED.notify('Port is required', 'error');
                    return;
                }
                button.text('Testing...').prop('disabled', true);
                $.ajax({ url: 'http://localhost:' + port + '/health', method: 'GET', timeout: 3000 })
                    .done(function() {
                        button.text(originalText).prop('disabled', false);
                        RED.notify('Port is already in use', 'warning');
                    })
                    .fail(function(xhr) {
                        button.text(originalText).prop('disabled', false);
                        RED.notify(xhr.status === 0 ? 'Port appears to be available' : 'Port is already in use', xhr.status === 0 ? 'success' : 'warning');
                    });
            });

            $('#refresh-status-btn').click(loadFlowServers);
            setTimeout(loadFlowServers, 500);

            $('#node-input-serverPort').on('input', function() {
                var port = parseInt($(this).val(), 10);
                var isValid = port > 0 && port < 65536;
                if (port && !isValid) {
                    $(this).addClass('input-error');
                    $('#port-validation').show().text('Port must be between 1 and 65535');
                } else {
                    $(this).removeClass('input-error');
                    $('#port-validation').hide();
                }
            });
        }
    });
</script>

<script type="text/html" data-template-name="mcp-endpoint">

        <input type="text" id="node-config-input-name" placeholder="Optional display name">
    </div>
    <div class="form-row">
        <label for="node-config-input-serverName"><i class="fa fa-server"></i> MCP Name</label>
        <input type="text" id="node-config-input-serverName" placeholder="node-red-mcp-server">
    </div>
    <div class="form-row">
        <label for="node-config-input-serverPath"><i class="fa fa-link"></i> MCP Path</label>
        <input type="text" id="node-config-input-serverPath" placeholder="/mcp">
    </div>
    <div class="form-row">
        <label for="node-config-input-advertisedScopes"><i class="fa fa-lock"></i> Base Scopes</label>
        <input type="text" id="node-config-input-advertisedScopes" placeholder="openid profile email">
    </div>
    <div class="form-row">
        <label for="node-config-input-adminToolsEnabled"><i class="fa fa-shield"></i> Admin Tools</label>
        <input type="checkbox" id="node-config-input-adminToolsEnabled" style="width: auto;">
        <span class="mcp-editor-note">Expose read-only admin tools on this endpoint.</span>
    </div>
    <div class="form-row">
        <label for="node-config-input-adminPort"><i class="fa fa-plug"></i> Admin Port</label>
        <input type="number" id="node-config-input-adminPort" min="1" max="65535" placeholder="1880">
    </div>
    <div class="form-row">
        <label for="node-config-input-adminToken"><i class="fa fa-key"></i> Admin Token</label>
        <input type="password" id="node-config-input-adminToken" autocomplete="off">
    </div>
</script>

<script type="text/html" data-template-name="mcp-flow-server">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Optional display name">
    </div>

    <div class="form-row">
        <label for="node-input-endpoint"><i class="fa fa-sitemap"></i> Endpoint</label>
        <input type="text" id="node-input-endpoint">
    </div>

    <hr>
    <h4>Runtime</h4>

    <div class="form-row">
        <label for="node-input-serverPort"><i class="fa fa-plug"></i> Port</label>
        <input type="number" id="node-input-serverPort" min="1" max="65535" placeholder="8001">
        <div id="port-validation" class="mcp-validation"></div>
        <button type="button" id="test-port-btn" class="btn btn-secondary mcp-button-row">
            <i class="fa fa-check"></i> Test Port
        </button>
    </div>

    <div class="form-row">
        <label for="node-input-autoStart"><i class="fa fa-play"></i> Auto Start</label>
        <input type="checkbox" id="node-input-autoStart" style="width: auto;">
    </div>

    <div class="form-row">
        <label for="node-input-enableCors"><i class="fa fa-globe"></i> CORS</label>
        <input type="checkbox" id="node-input-enableCors" style="width: auto;">
    </div>

    <hr>
    <h4>Local Extensions</h4>

    <div class="form-row">
        <label for="node-input-enablePicker"><i class="fa fa-list"></i> Picker App</label>
        <input type="checkbox" id="node-input-enablePicker" style="width: auto;">
        <span class="mcp-editor-note">Expose picker resources and picker_submit.</span>
    </div>

    <hr>
    <div class="form-row">
        <label></label>
        <button type="button" id="refresh-status-btn" class="btn btn-secondary">
            <i class="fa fa-refresh"></i> Refresh Status
        </button>
    </div>

    <div id="flow-servers-status" class="mcp-flow-server-status">Loading flow server status...</div>

    <style>
        .mcp-editor-note {
            margin-left: 10px;
            font-size: 12px;
            color: var(--red-ui-secondary-text-color, #666);
        }
        .mcp-validation {
            display: none;
            margin-top: 5px;
            font-size: 12px;
            color: #e74c3c;
        }
        .mcp-button-row {
            margin-top: 5px;
        }
        .mcp-flow-server-status {
            margin-top: 10px;
            padding: 10px;
            color: var(--red-ui-primary-text-color, #333);
            background: var(--red-ui-secondary-background, #f8f9fa);
            border-left: 4px solid var(--red-ui-text-color-link, #007bff);
            font-size: 12px;
        }
        .mcp-flow-server-status h5,
        .mcp-flow-server-status p,
        .mcp-flow-server-status ul {
            color: inherit;
        }
    </style>
</script>

<script type="text/html" data-help-name="mcp-endpoint">
    <p>Defines a logical MCP endpoint: public name, HTTP path, advertised OAuth scopes, and optional read-only admin tools.</p>
    <h3>Fields</h3>
    <dl class="message-properties">
        <dt>MCP Name <span class="property-type">string</span></dt>
        <dd>Name returned in MCP initialize responses and used for endpoint-scoped tool registration.</dd>
        <dt>MCP Path <span class="property-type">string</span></dt>
        <dd>HTTP JSON-RPC path served by an MCP Flow Server, for example <code>/internal/mcp/ops</code>.</dd>
        <dt>Base Scopes <span class="property-type">string</span></dt>
        <dd>Space- or comma-separated scopes advertised on tools exposed by this endpoint.</dd>
        <dt>Admin Tools <span class="property-type">boolean</span></dt>
        <dd>Exposes read-only admin tools for this endpoint. Keep this behind an authenticated gateway.</dd>
    </dl>
</script>

<script type="text/html" data-help-name="mcp-flow-server">
    <p>Runs an MCP endpoint on a local HTTP port and passes tool calls into Node-RED flows.</p>
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Endpoint <span class="property-type">mcp-endpoint</span></dt>
        <dd>Logical MCP endpoint containing the MCP name, path, base scopes, and admin-tool settings.</dd>
        <dt>Port <span class="property-type">number</span></dt>
        <dd>Local HTTP port. Multiple MCP Flow Server nodes may share one port when their endpoint paths differ.</dd>
        <dt>Auto Start <span class="property-type">boolean</span></dt>
        <dd>Start serving when Node-RED starts.</dd>
        <dt>CORS <span class="property-type">boolean</span></dt>
        <dd>Add browser CORS headers to responses from this local listener.</dd>
        <dt>Picker App <span class="property-type">boolean</span></dt>
        <dd>Expose picker resources and the internal <code>picker_submit</code> tool. This does not implement OAuth.</dd>
    </dl>
    <h3>Runtime</h3>
    <p>The node sends <code>mcp-tool-execute</code> messages to the flow and waits for matching <code>mcp-tool-response</code> messages.</p>
</script>
