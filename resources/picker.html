<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picker</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f4;
  --panel: #fffffb;
  --panel-strong: #ffffff;
  --text: #151512;
  --muted: #6a6961;
  --line: rgba(20, 20, 16, .12);
  --line-strong: rgba(20, 20, 16, .28);
  --accent: #111111;
  --accent-text: #ffffff;
  --focus: #0a84ff;
  --shadow: 0 18px 48px rgba(0, 0, 0, .10), 0 1px 2px rgba(0, 0, 0, .08);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10100e;
    --panel: #191916;
    --panel-strong: #20201c;
    --text: #f4f2ea;
    --muted: #aaa69a;
    --line: rgba(244, 242, 234, .12);
    --line-strong: rgba(244, 242, 234, .30);
    --accent: #f4f2ea;
    --accent-text: #111111;
    --shadow: 0 18px 48px rgba(0, 0, 0, .28), 0 1px 2px rgba(0, 0, 0, .40);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px;
  background: radial-gradient(circle at 20% 0%, rgba(255, 255, 255, .75), transparent 34%), var(--bg);
  color: var(--text);
  font: 15px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
}
.shell {
  width: 100%;
  max-width: 860px;
  margin: 0 auto;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: linear-gradient(180deg, var(--panel-strong), var(--panel));
  box-shadow: var(--shadow);
  overflow: hidden;
}
.header {
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--line);
}
h1 {
  margin: 0;
  font-size: clamp(22px, 3vw, 30px);
  line-height: 1.08;
  letter-spacing: -.035em;
  font-weight: 760;
}
.intro {
  max-width: 58ch;
  margin: 9px 0 0;
  color: var(--muted);
  font-size: 14px;
}
.options {
  display: grid;
  gap: 10px;
  padding: 14px;
}
.option {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 14px;
  align-items: start;
  min-height: 76px;
  padding: 17px 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: color-mix(in oklab, var(--panel-strong), transparent 8%);
  cursor: pointer;
  transition: transform 160ms cubic-bezier(.2, .8, .2, 1), border-color 160ms, background 160ms, box-shadow 160ms;
}
.option:hover {
  transform: translateY(-1px);
  border-color: var(--line-strong);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .06);
}
.option:active { transform: scale(.995); }
.option:has(input:checked) {
  border-color: var(--accent);
  background: color-mix(in oklab, var(--accent), var(--panel) 92%);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.option input {
  width: 22px;
  height: 22px;
  margin: 1px 0 0;
  accent-color: var(--accent);
}
.option input:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.label {
  font-size: 16px;
  line-height: 1.25;
  letter-spacing: -.015em;
  font-weight: 720;
}
.description {
  margin-top: 5px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.35;
}
.feedback-wrap {
  padding: 0 14px 14px;
}
textarea {
  display: block;
  width: 100%;
  min-height: 76px;
  padding: 13px 14px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: color-mix(in oklab, var(--panel-strong), transparent 5%);
  color: var(--text);
  font: inherit;
  resize: vertical;
  outline: none;
}
textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in oklab, var(--focus), transparent 78%); }
.footer {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: flex-end;
  padding: 14px;
  border-top: 1px solid var(--line);
}
.status {
  margin-right: auto;
  color: var(--muted);
  font-size: 12px;
}
button {
  min-width: 116px;
  border: 0;
  border-radius: 999px;
  padding: 11px 18px;
  background: var(--accent);
  color: var(--accent-text);
  font: inherit;
  font-weight: 680;
  cursor: pointer;
  transition: transform 160ms cubic-bezier(.2, .8, .2, 1), opacity 160ms;
}
button:hover:not(:disabled) { transform: translateY(-1px); }
button:active:not(:disabled) { transform: scale(.98); }
button:disabled { opacity: .42; cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) {
  .option, button { transition: none; }
  .option:hover, button:hover:not(:disabled), .option:active, button:active:not(:disabled) { transform: none; }
}
</style>
<body>
  <section class="shell" aria-labelledby="title">
    <header class="header">
      <h1 id="title">Choose an option</h1>
      <p id="intro" class="intro">Select the direction to continue with.</p>
    </header>
    <main id="options" class="options"></main>
    <div class="feedback-wrap">
      <textarea id="feedback" placeholder="Optional feedback or direction"></textarea>
    </div>
    <footer class="footer">
      <span id="status" class="status"></span>
      <button id="submit" disabled>Continue</button>
    </footer>
  </section>
<script>
const optionsEl=document.getElementById('options'),submit=document.getElementById('submit'),statusEl=document.getElementById('status');
let output={},input={},hostCapabilities={},submitting=false;let nextId=1;const pending=new Map();
function request(method,params){const id=nextId++;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function values(){return [...document.querySelectorAll('input[name=picker-option]:checked')].map(x=>x.value);}
function updateSubmitState(){submit.disabled=submitting||!values().length;}
function selectionText(selection){const feedback=selection.feedback?` Feedback: ${selection.feedback}`:'';return `Picker selection: ${selection.selectedIds.join(', ')}.${feedback} Continue using this selection.`;}
function canHandoff(){return Boolean(hostCapabilities.updateModelContext&&hostCapabilities.message);}
function optionLabel(item){return typeof item.label==='string'&&item.label.trim()?item.label.trim():String(item.id||'');}
function render(data){output=data||{};const list=Array.isArray(output.options)?output.options:[];const multiple=output.selectionMode==='multiple'||input.selectionMode==='multiple';document.getElementById('title').textContent=output.title||'Choose an option';document.getElementById('intro').textContent=output.description||(multiple?'Choose one or more options.':'Choose one option.');optionsEl.replaceChildren();for(const item of list){const id=String(item.id||'').trim();if(!id)continue;const option=document.createElement('label');option.className='option';const control=document.createElement('input');control.type=multiple?'checkbox':'radio';control.name='picker-option';control.value=id;control.addEventListener('change',updateSubmitState);option.append(control);const text=document.createElement('span');const name=document.createElement('div');name.className='label';name.textContent=optionLabel(item);text.append(name);if(typeof item.description==='string'&&item.description.trim()){const desc=document.createElement('div');desc.className='description';desc.textContent=item.description.trim();text.append(desc);}option.append(text);optionsEl.append(option);}updateSubmitState();}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=='2.0')return;if(message.id!==undefined&&pending.has(message.id)){const call=pending.get(message.id);pending.delete(message.id);message.error?call.reject(message.error):call.resolve(message.result);return;}if(message.method==='ui/notifications/tool-input'){input=message.params?.arguments||{};}if(message.method==='ui/notifications/tool-result'){render(message.params?.structuredContent||{});}}, {passive:true});
async function initialize(){try{const result=await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Picker',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline']}});hostCapabilities=result?.hostCapabilities||{};window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');}catch(error){statusEl.textContent='Could not initialize picker.';}}
initialize();
submit.addEventListener('click',async()=>{const selectedIds=values();if(!selectedIds.length){statusEl.textContent='Choose at least one option.';return;}submitting=true;updateSubmitState();statusEl.textContent='Sending selection…';const selection={selectionMode:output.selectionMode||input.selectionMode||'single',selectedIds,feedback:document.getElementById('feedback').value.trim()};try{const result=await request('tools/call',{name:'picker_submit',arguments:selection});if(result?.isError)throw new Error(result?.content?.[0]?.text||'Selection validation failed.');if(!canHandoff()){statusEl.textContent='Selection validated, but this host cannot send it to the conversation.';return;}await request('ui/update-model-context',{content:[{type:'text',text:selectionText(selection)}],structuredContent:{type:'picker_selection',...selection}});await request('ui/message',{role:'user',content:[{type:'text',text:selectionText(selection)}]});statusEl.textContent='Selection sent.';}catch(error){statusEl.textContent=error?.message||'Could not submit selection.';}finally{submitting=false;updateSubmitState();}});
</script>
</body>
</html>
