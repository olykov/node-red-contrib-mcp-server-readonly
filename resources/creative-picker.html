<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative variants</title>
<style>
:root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }
body { margin: 0; padding: 12px; } h2 { margin: 0 0 4px; font-size: 17px; } p { margin: 0 0 12px; opacity: .75; }
#options { display: grid; gap: 8px; } .option { display:flex; gap:10px; align-items:flex-start; border:1px solid #8886; border-radius:10px; padding:10px; cursor:pointer; }
.option:has(input:checked) { border-color:#6366f1; background:#6366f118; } .label { font-weight:650; } .description { font-size:13px; opacity:.8; }
textarea { box-sizing:border-box; display:block; width:100%; min-height:64px; margin-top:12px; padding:8px; border-radius:8px; border:1px solid #8886; background:transparent; font:inherit; }
footer { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; } button { border:0; border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; background:#6366f1; color:white; } button:disabled { opacity:.5; cursor:wait; } #status { margin-right:auto; align-self:center; font-size:12px; opacity:.7; }
</style>
<h2 id="title">Choose creative variants</h2><p id="intro">Select the direction to continue with.</p><main id="options"></main><textarea id="feedback" placeholder="Optional feedback or a direction in your own words"></textarea><footer><span id="status"></span><button id="submit" disabled>Continue</button></footer>
<script>
const optionsEl=document.getElementById('options'), submit=document.getElementById('submit'), statusEl=document.getElementById('status');
let output={}, input={}; let nextId=1; const pending=new Map();
function request(method,params){const id=nextId++;window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));}
function values(){return [...document.querySelectorAll('input[name=variant]:checked')].map(x=>x.value);}
function render(data){ output=data||{}; const list=Array.isArray(output.options)?output.options:[]; const multiple=output.selectionMode==='multiple'||input.selectionMode==='multiple'; document.getElementById('title').textContent=output.title||'Choose creative variants'; document.getElementById('intro').textContent=multiple?'Choose one or more directions.':'Choose one direction.'; optionsEl.replaceChildren(); for(const item of list){const label=document.createElement('label');label.className='option';const control=document.createElement('input');control.type=multiple?'checkbox':'radio';control.name='variant';control.value=String(item.id);control.addEventListener('change',()=>submit.disabled===false);label.append(control);const text=document.createElement('span');const name=document.createElement('div');name.className='label';name.textContent=item.label||item.id;text.append(name);if(item.description){const desc=document.createElement('div');desc.className='description';desc.textContent=item.description;text.append(desc);}label.append(text);optionsEl.append(label);} submit.disabled=!list.length;}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=='2.0')return;if(message.id!==undefined&&pending.has(message.id)){const call=pending.get(message.id);pending.delete(message.id);message.error?call.reject(message.error):call.resolve(message.result);return;}if(message.method==='ui/notifications/tool-input'){input=message.params||{};}if(message.method==='ui/notifications/tool-result'){render(message.params?.structuredContent||{});}}, {passive:true});
submit.addEventListener('click',async()=>{const selectedIds=values();if(!selectedIds.length){statusEl.textContent='Choose at least one option.';return;}submit.disabled=true;statusEl.textContent='Saving selection…';try{const result=await request('tools/call',{name:'creative_picker_submit',arguments:{selectionMode:output.selectionMode||input.selectionMode||'single',selectedIds,feedback:document.getElementById('feedback').value.trim()}});statusEl.textContent=result?.structuredContent?.message||'Selection saved.';}catch(error){statusEl.textContent=error?.message||'Could not save selection.';}finally{submit.disabled=false;}});
</script>
</html>
